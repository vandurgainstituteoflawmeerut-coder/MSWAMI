<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSWAMI | Vandurga Institute of Law, Meerut</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 1.25rem;
      padding: 3rem 2.5rem;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .logo {
      font-size: 2.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      font-size: 1.05rem;
      color: #94a3b8;
      margin-bottom: 1.75rem;
    }
    .status {
      display: inline-block;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      margin-bottom: 1.75rem;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }
    p {
      line-height: 1.65;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MSWAMI</div>
    <div class="subtitle">Vandurga Institute of Law, Meerut</div>
    <div class="status">● Online</div>
    <p>
      Welcome to the official MSWAMI portal.<br />
      This application is now live and accessible.
    </p>
    <p style="font-size: 0.9rem; color: #94a3b8;">
      More features and content will be added soon.
    </p>
    <div class="footer">
      © 2026 Vandurga Institute of Law, Meerut<br />
      All rights reserved.
    </div>
  </div>
</body>
</html>
